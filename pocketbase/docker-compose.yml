version: '3.8'

# =============================================================================
# MotifKain — PocketBase + Nginx (self-host)
# Usage:
#   docker-compose up -d
# Akses PocketBase di http://localhost:8090 (admin UI di /_/)
# Untuk HTTPS publik, uncomment blok `nginx` dan sediakan nginx.conf + ssl/.
# =============================================================================

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: motifkain-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb
    environment:
      - TZ=Asia/Jakarta

  # Opsional — aktifkan untuk HTTPS publik (api.motifkain.com → pocketbase:8090).
  # Anda perlu:
  #   - pocketbase/nginx.conf (reverse proxy config)
  #   - pocketbase/ssl/  (sertifikat Let's Encrypt)
  # Untuk development lokal, biarkan service ini nonaktif dan akses via :8090.
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: motifkain-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - pocketbase

volumes:
  pb_data: